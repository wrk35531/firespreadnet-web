<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FireSpreadNet Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap');
    body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-6">
    <!-- Header -->
    <div class="text-center border-b pb-4 mb-6">
      <h1 class="text-2xl font-bold text-gray-800 flex items-center justify-center gap-2">
        🔥 ระบบเครือข่ายติดตามการลุกลามของไฟป่า (FireSpreadNet) 🔥
      </h1>
    </div>

    <!-- Data Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <!-- Temp Card -->
      <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-xl shadow-sm text-center">
        <p class="text-gray-500 font-medium">🌡️ อุณหภูมิ</p>
        <p class="text-3xl font-bold text-red-600 my-1"><span id="temp">--</span> °C</p>
      </div>

      <!-- Hum Card -->
      <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-xl shadow-sm text-center">
        <p class="text-gray-500 font-medium">💧 ความชื้น</p>
        <p class="text-3xl font-bold text-blue-600 my-1"><span id="hum">--</span> %</p>
      </div>

      <!-- Status Card -->
      <div class="bg-green-50 border-l-4 border-green-500 p-4 rounded-r-xl shadow-sm text-center">
        <p class="text-gray-500 font-medium">🚨 สถานะ</p>
        <div class="mt-2">
          <span id="status-badge" class="px-3 py-1 bg-gray-200 text-gray-700 font-semibold rounded-full text-sm">
            รอเชื่อมต่อ...
          </span>
        </div>
      </div>
    </div>

    <!-- Map Container -->
    <div class="mb-6">
      <div id="map" class="h-64 rounded-xl shadow-inner border border-gray-200"></div>
    </div>

    <!-- Real-time Log Table -->
    <div>
      <h3 class="text-lg font-bold text-gray-700 mb-3 flex items-center gap-2">
        📊 บันทึกการรับข้อมูลล่าสุด (Real-time Log)
      </h3>
      <div class="overflow-x-auto rounded-xl border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200 text-sm text-center">
          <thead class="bg-slate-700 text-white">
            <tr>
              <th class="py-3 px-4">เวลา</th>
              <th class="py-3 px-4">อุณหภูมิ (°C)</th>
              <th class="py-3 px-4">ความชื้น (%)</th>
              <th class="py-3 px-4">สถานะ</th>
            </tr>
          </thead>
          <tbody id="log-body" class="bg-white divide-y divide-gray-100">
            <tr>
              <td colspan="4" class="py-4 text-gray-400">กำลังรอข้อมูลแรกจากเซิร์ฟเวอร์...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Firebase Database URL
    const FIREBASE_URL = "https://firespreadnet-35531-default-rtdb.asia-southeast1.firebasedatabase.app/FireSpreadNet.json";

    // ตั้งค่าแผนที่ Leaflet (พิกัดโรงเรียนวัดไร่ขิงวิทยา)
    const map = L.map('map').setView([13.7342, 100.2721], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const marker = L.marker([13.7342, 100.2721]).addTo(map);
    marker.bindPopup("<b>สถานีตรวจจับที่ 1</b><br>โรงเรียนวัดไร่ขิงวิทยา").openPopup();

    let logs = [];
    let lastTimeVal = null;
    let lastUpdatedTimestamp = Date.now();

    async function fetchData() {
      try {
        const response = await fetch(FIREBASE_URL);
        if (!response.ok) throw new Error("HTTP Error " + response.status);
        
        const data = await response.json();
        const now = Date.now();

        if (data && data.time !== undefined) {
          // ถ้าค่า time จาก ESP32 มีการเปลี่ยนแปลง แสดงว่าบอร์ดกำลังส่งข้อมูลอยู่จริง
          if (data.time !== lastTimeVal) {
            lastTimeVal = data.time;
            lastUpdatedTimestamp = now;
          }
        }

        // เช็กว่าข้อมูลหยุดอัปเดตเกิน 6 วินาทีหรือไม่ (ตั้งเผื่อ latency ไว้เล็กน้อย)
        if (now - lastUpdatedTimestamp > 6000) {
          // แสดงสถานะ ออฟไลน์
          document.getElementById('temp').innerText = '--';
          document.getElementById('hum').innerText = '--';
          
          const statusBadge = document.getElementById('status-badge');
          statusBadge.innerText = 'ออฟไลน์';
          statusBadge.className = "px-3 py-1 bg-gray-500 text-white font-bold rounded-full text-sm";
        } else if (data) {
          // แสดงข้อมูลตามปกติเมื่อบอร์ดเชื่อมต่ออยู่
          document.getElementById('temp').innerText = data.temperature !== undefined ? data.temperature.toFixed(1) : '--';
          document.getElementById('hum').innerText = data.humidity !== undefined ? data.humidity.toFixed(1) : '--';
          
          const statusBadge = document.getElementById('status-badge');
          const statusText = data.status || 'ปกติ';
          statusBadge.innerText = statusText;

          // ปรับสีป้ายสถานะ
          if (statusText === 'วิกฤต') {
            statusBadge.className = "px-3 py-1 bg-red-600 text-white font-bold rounded-full text-sm animate-pulse";
          } else if (statusText === 'เฝ้าระวัง') {
            statusBadge.className = "px-3 py-1 bg-yellow-500 text-white font-bold rounded-full text-sm";
          } else {
            statusBadge.className = "px-3 py-1 bg-green-600 text-white font-bold rounded-full text-sm";
          }

          // บันทึก Log ถ้าเป็นข้อมูลชุดใหม่
          const timeStr = new Date().toLocaleTimeString('th-TH');
          if (logs.length === 0 || logs[0].rawTime !== data.time) {
            logs.unshift({ rawTime: data.time, time: timeStr, temp: data.temperature, hum: data.humidity, status: statusText });
            if (logs.length > 5) logs.pop();

            const logBody = document.getElementById('log-body');
            logBody.innerHTML = logs.map(item => `
              <tr class="hover:bg-gray-50">
                <td class="py-2 px-4 text-gray-600">${item.time}</td>
                <td class="py-2 px-4 font-semibold text-red-600">${item.temp}</td>
                <td class="py-2 px-4 font-semibold text-blue-600">${item.hum}</td>
                <td class="py-2 px-4">${item.status}</td>
              </tr>
            `).join('');
          }
        }
      } catch (error) {
        console.error("Error fetching data:", error);
      }
    }

    // ดึงข้อมูลตรวจสอบทุกๆ 2 วินาที
    fetchData();
    setInterval(fetchData, 2000);
  </script>
