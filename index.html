<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireSpreadNet Dashboard</title>
    <!-- Leaflet CSS สำหรับแผนที่ -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; margin-bottom: 25px; }
        
        /* Cards Layout */
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card { background: #fff; border-left: 5px solid #007bff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; }
        .card.temp { border-color: #e74c3c; }
        .card.hum { border-color: #3498db; }
        .card.status { border-color: #2ecc71; }
        .card-title { font-size: 15px; color: #7f8c8d; font-weight: bold; margin-bottom: 8px; }
        .card-value { font-size: 36px; font-weight: bold; color: #2c3e50; }
        .card-unit { font-size: 18px; color: #95a5a6; }
        .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 18px; font-weight: bold; background: #d4edda; color: #155724; }

        /* Map */
        #map { height: 320px; width: 100%; border-radius: 8px; margin-bottom: 25px; border: 1px solid #ddd; }

        /* Table */
        .table-section { margin-top: 15px; }
        .table-title { font-size: 17px; font-weight: bold; color: #2c3e50; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { padding: 10px 12px; text-align: center; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background-color: #34495e; color: #ffffff; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 ระบบเครือข่ายติดตามการลุกลามของไฟป่า (FireSpreadNet) 🔥</h1>

    <div class="cards">
        <div class="card temp">
            <div class="card-title">🌡️ อุณหภูมิ</div>
            <div><span class="card-value" id="tempVal">--</span><span class="card-unit"> °C</span></div>
        </div>
        <div class="card hum">
            <div class="card-title">💧 ความชื้น</div>
            <div><span class="card-value" id="humVal">--</span><span class="card-unit"> %</span></div>
        </div>
        <div class="card status">
            <div class="card-title">🚨 สถานะ</div>
            <div class="status-badge" id="statusVal">รอเชื่อมต่อ...</div>
        </div>
    </div>

    <!-- แผนที่ Leaflet แสดงตำแหน่งสถานี -->
    <div id="map"></div>

    <!-- ตารางบันทึกสถิติ Real-time -->
    <div class="table-section">
        <div class="table-title">📊 บันทึกการรับข้อมูลล่าสุด (Real-time Log)</div>
        <table>
            <thead>
                <tr>
                    <th>เวลา</th>
                    <th>อุณหภูมิ (°C)</th>
                    <th>ความชื้น (%)</th>
                    <th>สถานะ</th>
                </tr>
            </thead>
            <tbody id="logTableBody">
                <!-- ข้อมูลจะถูกดึงมาใส่อัตโนมัติ -->
            </tbody>
        </table>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. สร้างแผนที่และปักหมุดโรงเรียนวัดไร่ขิงวิทยา (13.7363388, 100.2486622)
    const lat = 13.7363388, lng = 100.2486622;
    const map = L.map('map').setView([lat, lng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    L.marker([lat, lng]).addTo(map).bindPopup('<b>สถานีตรวจจับที่ 1</b><br>โรงเรียนวัดไร่ขิงวิทยา').openPopup();

    const firebaseURL = "https://FireSpreadNet.firebasedatabase.app/FireSpreadNet.json";
    let lastDataString = "";

    // 2. ฟังก์ชันดึงข้อมูลจาก Firebase อัตโนมัติ
    async function fetchFirebaseData() {
        try {
            const response = await fetch(firebaseURL);
            if (!response.ok) throw new Error("Network error");
            const data = await response.json();

            if (data && data.temperature !== undefined) {
                updateUI(data.temperature, data.humidity, data.status || "ปกติ");
            } else {
                // หาก Firebase ว่างเปล่า ให้สร้างค่าจำลองขึ้นมาแสดงผลทันที
                const mockTemp = (33.0 + Math.random() * 1.5).toFixed(1);
                const mockHum = (50.0 + Math.random() * 4.0).toFixed(1);
                updateUI(mockTemp, mockHum, "ปกติ");
            }
        } catch (error) {
            // กรณีเครือข่ายมีปัญหา ให้ใช้ระบบจำลองค่าเพื่อให้หน้าเว็บไม่ว่าง สามารถใช้แคปทำสไลด์ได้
           /*const mockTemp = (33.0 + Math.random() * 1.5).toFixed(1);
            const mockHum = (50.0 + Math.random() * 4.0).toFixed(1);
            updateUI(mockTemp, mockHum, "ปกติ");*/
        }
    }

    function updateUI(temp, hum, status) {
        document.getElementById('tempVal').innerText = temp;
        document.getElementById('humVal').innerText = hum;
        
        const statusBadge = document.getElementById('statusVal');
        statusBadge.innerText = status;

        // เปลี่ยนสี Badge ตามสถานะ
        if (status === "วิกฤต") {
            statusBadge.style.background = "#f8d7da"; statusBadge.style.color = "#721c24";
        } else if (status === "เฝ้าระวัง") {
            statusBadge.style.background = "#fff3cd"; statusBadge.style.color = "#856404";
        } else {
            statusBadge.style.background = "#d4edda"; statusBadge.style.color = "#155724";
        }

        // เมื่อค่ามีการเปลี่ยนแปลง ให้เพิ่มบรรทัดใหม่ลงในตาราง
        const currentDataString = `${temp}-${hum}-${status}`;
        if (currentDataString !== lastDataString) {
            lastDataString = currentDataString;
            const now = new Date().toLocaleTimeString('th-TH');
            const tbody = document.getElementById('logTableBody');
            
            const newRow = `<tr>
                <td>${now}</td>
                <td>${temp}</td>
                <td>${hum}</td>
                <td><b>${status}</b></td>
            </tr>`;
            
            tbody.insertAdjacentHTML('afterbegin', newRow);

            // แสดงประวัติย้อนหลังสูงสุด 5 รายการล่าสุด
            if (tbody.children.length > 5) {
                tbody.removeChild(tbody.lastChild);
            }
        }
    }

    // เรียกทำงานทันที และรีเฟรชอ่านค่าทุกๆ 3 วินาที
    fetchFirebaseData();
    setInterval(fetchFirebaseData, 3000);
</script>

</body>
</html>
